name: Tests

# Pull requests and pushes to main only. There is one long-lived branch, so
# anything else is a feature branch that will arrive here as a pull request
# anyway, and running both would double the work for no extra signal.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request makes the run in progress irrelevant. `main`
# keeps its runs, since those are the ones that say whether the branch is good.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # A pinned rule set that nothing runs is documentation, not a gate. Its own
  # job, so a lint failure is legible as one rather than as a red test run --
  # and so it reports in under a minute instead of waiting behind the
  # astrometry.net install and the scientific stack.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The `lint` group is ruff and pre-commit, not the test dependencies.
      - name: Install
        run: uv sync --locked --only-group lint

      # Separate steps: "which one failed" should not need the log opened.
      - name: Check lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide the result for the other.
      fail-fast: false
      matrix:
        # `requires-python = ">=3.12"`, so both supported versions are covered
        # rather than only the one that happens to be installed locally.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
        with:
          # `hatch-vcs` derives the version from the nearest `v*` tag, and a
          # default checkout fetches no tags at all -- so a shallow clone gives
          # the package no version to build from.
          fetch-depth: 0

      # `astrometry-data-tycho2-10-19` provides index-4110 to index-4119. A real
      # PANOPTES frame solves with index-4112 and the test fixture with
      # index-4116, so this series is what our field scale needs and no extra
      # index download is required.
      #
      # `libcfitsio-bin` supplies `funpack`. Without it `get_solve_field` cannot
      # unpack a `.fz`, hands `solve-field` a file it cannot read, and every
      # solve of a compressed frame fails with "no WCS header present" -- while
      # uncompressed frames still solve, which makes it look like a fixture
      # problem rather than a missing tool. `panoptes-utils` installs it for the
      # same reason.
      - name: Install astrometry.net and index files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            astrometry.net astrometry-data-tycho2-10-19 libcfitsio-bin

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--locked` fails rather than re-resolving, so a dependency edit that
      # skipped `uv lock` is caught here instead of silently testing something
      # other than what the lockfile describes. The suite wants no credentials,
      # no network and no cloud project.
      #
      # `--no-default-groups` because the default group is `dev`, which includes
      # `docs` and `lint`: a bare `--group test` would install zensical and
      # pre-commit in order to run the suite.
      - name: Install
        run: uv sync --locked --no-default-groups --group test --python ${{ matrix.python-version }}

      # Plate solving runs for real here, against a rebinned frame committed
      # under `tests/data`. The full end-to-end test still skips: it also needs
      # a catalog, which is per-field and not shipped. `-ra` is already in
      # `addopts`, so any skip prints its reason rather than passing silently.
      #
      # `[tool.coverage.run]` already names the source, so `--cov` needs no
      # argument. `--no-sync` keeps `uv run` from re-syncing the default groups
      # the install step deliberately left out.
      - name: Test with coverage
        run: uv run --no-sync pytest --cov --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload coverage (xml)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml

      # The artifact above is for looking at a single run; this is what gives
      # the README's coverage badge something to report. `fail_ci_if_error`
      # stays false deliberately: a coverage upload failing is not a reason to
      # fail a test run that passed.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
