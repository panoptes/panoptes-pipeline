[build-system]
requires = [
    "hatchling>=1.25.0",
    "hatch-vcs>=0.4"
]
build-backend = "hatchling.build"

[project]
name = "panoptes-pipeline"
description = "PANOPTES Image Processing for the Extraction of Lightcurves in Nearby Exoplanets!"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { file = "LICENSE.txt" }
authors = [
    { name = "PANOPTES Team", email = "developers@projectpanoptes.org" },
]
dynamic =["version"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
# Everything the package needs. There are no extras: the cloud stack and the
# notebook execution path were removed rather than made optional, so `uv sync`
# gives an environment in which every module imports.
dependencies = [
  # Arrays and the algorithm itself.
  "numpy",
  "scikit-learn",
  "scipy",
  # Tabular and on-disk products.
  "h5py",
  "numexpr",
  "pandas",
  "pyarrow",
  "tables",
  # Astronomy.
  "astropy",
  # 0.3.1 is where `ImagePathInfo` landed, which this package imports.
  "panoptes-utils[images]>=0.3.1",
  "photutils",
  # `photutils.segmentation.deblend_sources` imports scikit-image, which
  # photutils only declares under its `all` extra. Source detection raises
  # `ModuleNotFoundError` without it.
  "scikit-image",
  # Plotting, configuration, logging, CLI.
  "loguru",
  "matplotlib",
  "pydantic",
  "pydantic-settings",
  "python-dateutil",
  "seaborn",
  "tqdm",
  "typer",
]

# Tooling, not package metadata: installed by `uv sync`, never published.
[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-doctestplus",
  "pytest-remotedata>=0.3.1",
  "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/panoptes/panoptes-pipeline"
"POCS Documentation" = "https://pocs.readthedocs.io"
"Project PANOPTES" = "https://www.projectpanoptes.org"
Forum = "https://forum.projectpanoptes.org"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
include = [
  "src/panoptes/**",
  "README.md",
  "LICENSE.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["src/panoptes"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE.txt"]

# Ruff configuration (formatting + linting)
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


# Pytest configuration migrated from legacy tooling
[tool.pytest.ini_options]
addopts = [
  "--strict-markers",
  "-ra",
]
# Doctest flags used by pytest-doctestplus
# Available flags: ELLIPSIS, NORMALIZE_WHITESPACE, IGNORE_EXCEPTION_DETAIL, ALLOW_UNICODE
# See: https://pytest-doctestplus.readthedocs.io
doctest_optionflags = [
  "ELLIPSIS",
  "NORMALIZE_WHITESPACE",
  "IGNORE_EXCEPTION_DETAIL",
  "ALLOW_UNICODE",
]

testpaths = ["tests", "src"]
# Avoid recursing into non-test directories
norecursedirs = ["scripts", "dist", "build"]
filterwarnings = [
  "ignore:elementwise == comparison failed:DeprecationWarning",
  "ignore::pytest.PytestDeprecationWarning",
]

# Coverage, migrated from the PyScaffold-era .coveragerc.
[tool.coverage.run]
branch = true
source = ["panoptes.pipeline"]

[tool.coverage.paths]
source = ["src/", "*/site-packages/"]

[tool.coverage.report]
exclude_lines = [
  # Re-enable the standard pragma, which naming this key at all would disable.
  "pragma: no cover",
  # Debug-only code.
  "def __repr__",
  "if self\\.debug",
  # Defensive assertions tests are not expected to reach.
  "raise AssertionError",
  "raise NotImplementedError",
  # Non-runnable code.
  "if 0:",
  "if __name__ == .__main__.:",
]
