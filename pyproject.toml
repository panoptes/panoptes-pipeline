[build-system]
requires = [
    "hatchling>=1.25.0",
    "hatch-vcs>=0.4"
]
build-backend = "hatchling.build"

[project]
name = "panoptes-pipeline"
description = "PANOPTES Image Processing for the Extraction of Lightcurves in Nearby Exoplanets!"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { file = "LICENSE.txt" }
authors = [
    { name = "PANOPTES Team", email = "developers@projectpanoptes.org" },
]
dynamic =["version"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
# Everything the algorithm and the local data path need. The cloud stack and the
# notebook execution path are extras, so `uv sync` gives a working test
# environment without a GCP install.
dependencies = [
  # Arrays and the algorithm itself.
  "numpy",
  "scikit-learn",
  "scipy",
  # Tabular and on-disk products.
  "h5py",
  "numexpr",
  "pandas",
  "pyarrow",
  "tables",
  # Astronomy.
  "astropy",
  "panoptes-data>=0.1.5,<0.2",  # see improvement plan 6.18
  "panoptes-utils[images]>=0.2.33",
  "photutils",
  # Plotting, configuration, logging, CLI.
  "loguru",
  "matplotlib",
  "pydantic",
  "pydantic-settings",
  "python-dateutil",
  "seaborn",
  "tqdm",
  "typer",
]

[project.optional-dependencies]
# The legacy cloud clients still imported by `utils/gcp`, `utils/sources` and
# `utils/images`. Slated for removal; see the GCP issues.
cloud = [
  "gcsfs",
  "google-cloud-bigquery",
  "google-cloud-bigquery-storage[pandas]>=2.6.2",
  "google-cloud-firestore",
  "google-cloud-storage",
  "pandas-gbq",
]

# Tooling, not package metadata: installed by `uv sync`, never published.
[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-doctestplus",
  "pytest-remotedata>=0.3.1",
  "ruff>=0.5.0",
]
docs = [
  "myst-parser[linkify]",
  "sphinx>=3.2.1",
]

[project.urls]
Homepage = "https://github.com/panoptes/panoptes-pipeline"
Documentation = "https://panoptes-pipeline.readthedocs.io"
"POCS Documentation" = "https://pocs.readthedocs.io"
"Project PANOPTES" = "https://www.projectpanoptes.org"
Forum = "https://forum.projectpanoptes.org"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
include = [
  "src/panoptes/**",
  "README.md",
  "LICENSE.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["src/panoptes"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE.txt", "docs"]

# Ruff configuration (formatting + linting)
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


# Pytest configuration migrated from legacy tooling
[tool.pytest.ini_options]
addopts = [
  "--strict-markers",
  "-ra",
]
# Doctest flags used by pytest-doctestplus
# Available flags: ELLIPSIS, NORMALIZE_WHITESPACE, IGNORE_EXCEPTION_DETAIL, ALLOW_UNICODE
# See: https://pytest-doctestplus.readthedocs.io
doctest_optionflags = [
  "ELLIPSIS",
  "NORMALIZE_WHITESPACE",
  "IGNORE_EXCEPTION_DETAIL",
  "ALLOW_UNICODE",
]

testpaths = ["tests", "src"]
# Avoid recursing into non-test directories
norecursedirs = ["script", "resources", "dist", "build", ".tox"]
filterwarnings = [
  "ignore:elementwise == comparison failed:DeprecationWarning",
  "ignore::pytest.PytestDeprecationWarning",
]
