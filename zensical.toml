# The documentation site. Zensical builds `docs/` into `site/`; the GitHub
# Pages workflow publishes that. See project standards 5 for why this is
# configured the way it is, and `docs/building.md` for how to build it.
[project]
site_name = "panoptes-pipeline"
site_description = "Differential photometry for PANOPTES: recovering exoplanet transits from DSLR wide-field images with a Bayer color filter array."
site_url = "https://panoptes.github.io/panoptes-pipeline/"
repo_url = "https://github.com/panoptes/panoptes-pipeline"
repo_name = "panoptes/panoptes-pipeline"
# No `edit_uri`: nearly every page is a wrapper including a file from the
# repository root, so an edit link would open the one-line wrapper rather
# than the `README.md` or `CHANGELOG.md` the reader is actually looking at.

nav = [
  { "Home" = "index.md" },
  { "Contributing" = "contributing.md" },
  { "Building the docs" = "building.md" },
  { "Changelog" = "changelog.md" },
  { "API reference" = [
    { "lightcurve" = [
      { "core" = "api/lightcurve/core.md" },
      { "masks" = "api/lightcurve/masks.md" },
      { "metrics" = "api/lightcurve/metrics.md" },
      { "injection" = "api/lightcurve/injection.md" },
      { "detection" = "api/lightcurve/detection.md" },
    ] },
    { "processing" = "api/processing.md" },
    { "products" = "api/products.md" },
    { "provenance" = "api/provenance.md" },
    { "worklist" = "api/worklist.md" },
    { "status" = "api/status.md" },
    { "index" = "api/index-module.md" },
    { "settings" = "api/settings.md" },
    { "utils" = [
      { "images" = "api/utils/images.md" },
      { "sources" = "api/utils/sources.md" },
      { "observations" = "api/utils/observations.md" },
      { "plot" = "api/utils/plot.md" },
    ] },
  ] },
  { "Authors" = "authors.md" },
  { "License" = "license.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}

# `README.md`, `CHANGELOG.md` and the rest live at the repository root, where
# GitHub and PyPI read them. The pages under `docs/` include them from there
# rather than holding a second copy. `check_paths` matters: without it a
# snippet pointing at a moved file renders as nothing and publishes a hole.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true

# Docstrings are the API reference: `::: panoptes.pipeline.products` in a
# Markdown file is the whole page. `paths` points griffe at the working tree, so
# the reference describes this checkout rather than whatever copy of the package
# happens to be installed.
"zensical.extensions.mkdocstrings".handlers.python.paths = ["src"]
"zensical.extensions.mkdocstrings".handlers.python.options.docstring_style = "google"
"zensical.extensions.mkdocstrings".handlers.python.options.show_root_heading = true
"zensical.extensions.mkdocstrings".handlers.python.options.show_signature_annotations = true
"zensical.extensions.mkdocstrings".handlers.python.options.separate_signature = true
"zensical.extensions.mkdocstrings".handlers.python.options.members_order = "source"
"zensical.extensions.mkdocstrings".handlers.python.options.filters = ["!^_"]
